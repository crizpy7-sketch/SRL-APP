<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GCS Buildings - SRL Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{background:#16181D}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

    // ════════════════════════════════════════════════════════
    // ⚙️ SETUP — paste your Supabase values here (2 lines only)
    // Find them at: supabase.com → your project → Settings → API
    // ════════════════════════════════════════════════════════
    const SUPA_URL = "https://bjnkgxkcbbnbtazelsjs.supabase.co";
    const SUPA_KEY = "sb_publishable_F49fzNl_CTWUdJy5ZdMDMw_MFrIOXw-";
    // ════════════════════════════════════════════════════════

    const CONFIGURED = !SUPA_URL.includes("PASTE");
    const H = { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json" };

    async function dbGet(id) {
      if (!CONFIGURED) return null;
      const r = await fetch(SUPA_URL + "/rest/v1/app_state?id=eq." + id + "&select=data", { headers: H });
      if (!r.ok) throw new Error("db");
      const j = await r.json();
      return j[0] ? j[0].data : null;
    }
    async function dbSet(id, data) {
      if (!CONFIGURED) return;
      const r = await fetch(SUPA_URL + "/rest/v1/app_state", {
        method: "POST",
        headers: { ...H, "Prefer": "resolution=merge-duplicates" },
        body: JSON.stringify({ id, data })
      });
      if (!r.ok) throw new Error("db");
    }

    const { useState, useEffect, useRef } = React;
    const { LogOut, ChevronRight, Lock, HardHat, CheckCircle2, X, Camera, Paperclip, FileText, MapPin, Printer, LayoutDashboard, PackagePlus, ListChecks, Search, Truck, Warehouse, ArrowDownToLine, ArrowUpFromLine, Activity, Boxes, User, RefreshCw } = LucideReact;

    const C = { ink:"#16181D", inkSoft:"#1F232B", line:"#2B3038", paper:"#F4F3EF", card:"#FFF", border:"#E4E2DB", text:"#21242B", muted:"#6B7280", accent:"#E8910C", accentSoft:"#FBEFD7" };
    const sf = { fontFamily:"'IBM Plex Sans',sans-serif" };
    const mf = { fontFamily:"'IBM Plex Mono',monospace" };
    const df = { fontFamily:"'Saira Condensed',sans-serif" };

    const BUILDINGS = ["GCS-A","GCS-B"];
    const LEVELS = ["Ground Level","Mezzanine Level","Rooftop"];
    const USERS = [
      { name:"Cristian Lopez",  role:"Inventory Manager", building:null,    code:"1111" },
      { name:"Genaro Collazo",  role:"QC",                building:"GCS-A", code:"2222" },
      { name:"Isaias Alfaro",   role:"General Foreman",   building:"GCS-A", code:"3333" },
      { name:"Antonio Chavez",  role:"QC",                building:"GCS-B", code:"4444" },
      { name:"Manuel Morales",  role:"General Foreman",   building:"GCS-B", code:"5555" },
    ];

    const inp = { ...sf, background:"#FBFAF7", border:"1px solid "+C.border, color:C.text, borderRadius:8, padding:"10px 14px", fontSize:15, width:"100%", outline:"none", boxSizing:"border-box" };
    const btnS = (bg,fg) => ({ ...sf, background:bg, color:fg, border:"none", borderRadius:8, padding:"12px 16px", fontWeight:700, fontSize:15, cursor:"pointer", width:"100%", display:"flex", alignItems:"center", justifyContent:"center", gap:8 });
    const lbl = { ...sf, color:C.muted, fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:0.5, marginBottom:6 };

    function Badge({ status }) {
      const map = { installed:{l:"Installed",bg:"#E7F4EC",fg:"#1B7A43",dot:"#22A35A"}, removed:{l:"Removed",bg:"#FBEAEA",fg:"#B23030",dot:"#D14343"}, "pmi-received":{l:"PMI In",bg:"#E8F0FB",fg:"#1F5FB0",dot:"#2C76D1"}, "pmi-returned":{l:"PMI Out",bg:"#F1ECF9",fg:"#6A45A8",dot:"#8A5BD0"} };
      const s = map[status]||{l:status,bg:"#EEE",fg:"#444",dot:"#999"};
      return (
        <span style={{ ...sf, background:s.bg, color:s.fg, borderRadius:99, padding:"3px 10px", fontSize:11, fontWeight:700, display:"inline-flex", alignItems:"center", gap:5, whiteSpace:"nowrap" }}>
          <span style={{ width:6, height:6, borderRadius:99, background:s.dot }}/>{s.l}
        </span>
      );
    }

    function SectionHead({ icon:Icon, color, bg, title, right }) {
      return (
        <div style={{ padding:"12px 16px", borderBottom:"1px solid "+C.border, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{ width:30, height:30, borderRadius:8, background:bg, display:"grid", placeItems:"center" }}><Icon size={16} color={color}/></div>
            <span style={{ ...sf, fontWeight:600 }}>{title}</span>
          </div>
          {right}
        </div>
      );
    }

    function PinPad({ label, code, onOk, onBack }) {
      const [pin,setPin] = useState(""); const [err,setErr] = useState("");
      const press = k => {
        if(pin.length>=4) return;
        const n = pin+k; setPin(n);
        if(n.length===4) setTimeout(()=>{ if(n===code) onOk(); else { setErr("Wrong code"); setPin(""); } },120);
      };
      return (
        <div style={{ background:C.ink, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
          <div style={{ width:"100%", maxWidth:320 }}>
            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:32, justifyContent:"center" }}>
              <div style={{ background:C.accent, borderRadius:10, width:44, height:44, display:"grid", placeItems:"center" }}><Lock size={22} color={C.ink}/></div>
              <div><div style={{ ...df, color:"#fff", fontSize:22, fontWeight:700 }}>Enter Code</div><div style={{ ...mf, color:"#7E8794", fontSize:11 }}>{label}</div></div>
            </div>
            <div style={{ background:C.inkSoft, borderRadius:12, padding:20, border:"1px solid "+C.line }}>
              <div style={{ display:"flex", justifyContent:"center", gap:12, marginBottom:20 }}>
                {[0,1,2,3].map(i=><div key={i} style={{ width:14, height:14, borderRadius:99, background:i<pin.length?C.accent:C.line }}/>)}
              </div>
              {err && <div style={{ ...sf, color:"#D14343", fontSize:12, textAlign:"center", marginBottom:10 }}>{err}</div>}
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
                {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((k,i)=>(
                  <button key={i} onClick={()=>k==="⌫"?setPin(p=>p.slice(0,-1)):k!==""&&press(String(k))}
                    style={{ ...df, background:k===""?"transparent":C.inkSoft, color:"#E6E8EC", border:k===""?"none":"1px solid "+C.line, borderRadius:10, padding:"14px 0", fontSize:20, fontWeight:700, cursor:"pointer" }}>
                    {k}
                  </button>
                ))}
              </div>
            </div>
            <button onClick={onBack} style={{ ...sf, color:"#7E8794", background:"none", border:"none", width:"100%", marginTop:16, cursor:"pointer", fontSize:14 }}>← Back</button>
          </div>
        </div>
      );
    }

    const compressImage = (file) => new Promise((res) => {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const cv = document.createElement("canvas");
          const sc = Math.min(1, 800/Math.max(img.width,img.height));
          cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
          cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
          res(cv.toDataURL("image/jpeg",0.6));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });

    function FileUploader({ files, setFiles }) {
      const imgRef = useRef(); const fileRef = useRef();
      const [preview, setPreview] = useState(null);
      const MAX = 5;
      const addImages = async fs => {
        for (const f of Array.from(fs).slice(0,MAX-files.length)) {
          const data = await compressImage(f);
          setFiles(p => p.length<MAX?[...p,{name:f.name,type:"image/jpeg",data}]:p);
        }
      };
      const addFiles = fs => Array.from(fs).slice(0,MAX-files.length).forEach(f => {
        if(f.size > 1500000) return;
        const r = new FileReader(); r.onload = e => setFiles(p => p.length<MAX?[...p,{name:f.name,type:f.type,data:e.target.result}]:p); r.readAsDataURL(f);
      });
      return (
        <div>
          <div style={{ display:"flex", gap:8, marginBottom:10, alignItems:"center" }}>
            <button type="button" onClick={()=>imgRef.current.click()} disabled={files.length>=MAX}
              style={{ ...sf, background:"#FBEFD7", color:"#9A5E04", border:"1px solid #F5D08A", borderRadius:8, padding:"7px 12px", fontSize:13, fontWeight:600, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
              <Camera size={14}/> Photo
            </button>
            <button type="button" onClick={()=>fileRef.current.click()} disabled={files.length>=MAX}
              style={{ ...sf, background:"#E8F0FB", color:"#1F5FB0", border:"1px solid #B6CFF5", borderRadius:8, padding:"7px 12px", fontSize:13, fontWeight:600, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>
              <Paperclip size={14}/> File
            </button>
            <span style={{ ...sf, color:C.muted, fontSize:12, marginLeft:"auto" }}>{files.length}/{MAX}</span>
          </div>
          <input ref={imgRef} type="file" accept="image/*" multiple style={{ display:"none" }} onChange={e=>{addImages(e.target.files);e.target.value="";}}/>
          <input ref={fileRef} type="file" multiple style={{ display:"none" }} onChange={e=>{addFiles(e.target.files);e.target.value="";}}/>
          {files.length>0 && (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:6 }}>
              {files.map((f,i)=>(
                <div key={i} style={{ position:"relative", borderRadius:8, overflow:"hidden", border:"1px solid "+C.border, aspectRatio:"1", background:C.paper }}>
                  {f.type && f.type.startsWith("image/") ? <img src={f.data} style={{ width:"100%", height:"100%", objectFit:"cover" }} onClick={()=>setPreview(f.data)}/>
                    : <div style={{ width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center" }}><FileText size={20} color={C.muted}/></div>}
                  <button onClick={()=>setFiles(p=>p.filter((_,j)=>j!==i))} style={{ position:"absolute", top:2, right:2, background:"rgba(0,0,0,0.55)", border:"none", borderRadius:99, width:22, height:22, cursor:"pointer", display:"grid", placeItems:"center" }}><X size={11} color="#fff"/></button>
                </div>
              ))}
            </div>
          )}
          {preview && <div onClick={()=>setPreview(null)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}><img src={preview} style={{ maxWidth:"100%", maxHeight:"100%", borderRadius:12 }}/></div>}
        </div>
      );
    }

    function EntryFiles({ entryId, count }) {
      const [files, setFiles] = useState(null);
      const [open, setOpen] = useState(false);
      const [preview, setPreview] = useState(null);
      if(!count) return null;
      const load = async () => {
        setOpen(true);
        if(files) return;
        try { const d = await dbGet("f-"+entryId); setFiles(d||[]); }
        catch(e){ setFiles([]); }
      };
      return (
        <React.Fragment>
          <button onClick={load} style={{ ...sf, background:"#E8F0FB", color:"#1F5FB0", border:"none", borderRadius:6, padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer", marginTop:6, display:"inline-flex", alignItems:"center", gap:5 }}>
            <Camera size={12}/> View files ({count})
          </button>
          {open && (
            <div onClick={()=>setOpen(false)} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:998, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
              <div onClick={e=>e.stopPropagation()} style={{ background:C.card, borderRadius:14, padding:16, width:"100%", maxWidth:380, maxHeight:"70vh", overflowY:"auto" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                  <span style={{ ...sf, fontWeight:700 }}>Attachments</span>
                  <button onClick={()=>setOpen(false)} style={{ background:C.paper, border:"none", borderRadius:99, width:28, height:28, cursor:"pointer", display:"grid", placeItems:"center" }}><X size={14}/></button>
                </div>
                {!files ? <div style={{ ...sf, color:C.muted, textAlign:"center", padding:20 }}>Loading…</div>
                  : files.length===0 ? <div style={{ ...sf, color:C.muted, textAlign:"center", padding:20 }}>No files found</div>
                  : <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8 }}>
                      {files.map((f,i)=>(
                        f.type && f.type.startsWith("image/")
                          ? <img key={i} src={f.data} onClick={()=>setPreview(f.data)} style={{ width:"100%", aspectRatio:"1", objectFit:"cover", borderRadius:8, cursor:"pointer", border:"1px solid "+C.border }}/>
                          : <div key={i} style={{ aspectRatio:"1", borderRadius:8, background:"#E8F0FB", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4, padding:4 }}>
                              <FileText size={20} color="#2C76D1"/>
                              <span style={{ ...mf, fontSize:9, color:C.muted, textAlign:"center", wordBreak:"break-all" }}>{(f.name||"").slice(0,18)}</span>
                            </div>
                      ))}
                    </div>}
              </div>
              {preview && <div onClick={(e)=>{e.stopPropagation();setPreview(null);}} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.9)", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}><img src={preview} style={{ maxWidth:"100%", maxHeight:"100%", borderRadius:12 }}/></div>}
            </div>
          )}
        </React.Fragment>
      );
    }

    function Reports({ inv, shack }) {
      const [rType, setRType] = useState("installed");
      const [rBldg, setRBldg] = useState("All");
      const [rStatus, setRStatus] = useState("All");
      const getInstalled = () => { const a=new Set(),o=[]; inv.forEach(e=>{ if(e.status==="installed"&&!a.has(e.srlId)){a.add(e.srlId);o.push(e);}else if(e.status==="removed")a.delete(e.srlId);}); return o; };
      const preview = (() => {
        if(rType==="shack"){const bs=rBldg==="All"?BUILDINGS:[rBldg];return bs.flatMap(b=>(shack[b]||[]).map(x=>({...x,building:b})));}
        if(rType==="installed"){let r=getInstalled();if(rBldg!=="All")r=r.filter(x=>x.building===rBldg);return r;}
        let r=[...inv];if(rBldg!=="All")r=r.filter(x=>x.building===rBldg);if(rStatus!=="All")r=r.filter(x=>x.status===rStatus);return r;
      })();
      const doPrint = () => {
        const now = new Date().toLocaleString();
        let title, cols, rows;
        if(rType==="shack"){ title="Print Shack"+(rBldg!=="All"?" - "+rBldg:""); cols=["SRL ID","Building","Received"]; rows=preview.map(x=>[x.srlId,x.building,x.ts]); }
        else if(rType==="installed"){ title="Installed SRLs"+(rBldg!=="All"?" - "+rBldg:""); cols=["SRL ID","Building","Level","Hivis","Column","Comment","By","Time"]; rows=preview.map(x=>[x.srlId,x.building,x.level,x.hivis,x.column,x.comment||"-",x.by,x.ts]); }
        else { title="Full Log"+(rBldg!=="All"?" - "+rBldg:""); cols=["SRL ID","Status","Building","Level","By","Time"]; rows=preview.map(x=>[x.srlId,x.status,x.building,x.level,x.by,x.ts]); }
        const html = "<!DOCTYPE html><html><head><title>"+title+"</title><style>body{font-family:Arial;margin:32px;color:#111}h1{font-size:22px;margin:0}.sub{color:#666;font-size:13px;margin:4px 0 24px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#16181D;color:#fff;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase}td{padding:8px 10px;border-bottom:1px solid #E4E2DB}tr:nth-child(even) td{background:#F9F8F5}</style></head><body><h1>GCS BUILDINGS - "+title+"</h1><div class='sub'>Generated: "+now+" | "+rows.length+" record(s)</div><table><thead><tr>"+cols.map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table></body></html>";
        const w = window.open("","_blank"); w.document.write(html); w.document.close(); setTimeout(()=>w.print(),400);
      };
      return (
        <div>
          <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, marginBottom:12, overflow:"hidden" }}>
            <SectionHead icon={Printer} color="#9A5E04" bg={C.accentSoft} title="Report Settings"/>
            <div style={{ padding:16 }}>
              <div style={{ marginBottom:12 }}>
                <div style={lbl}>Report Type</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:6 }}>
                  {[["shack","Print Shack"],["installed","Installed"],["log","Full Log"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setRType(v)} style={{ ...sf, background:rType===v?C.accent:C.paper, color:rType===v?C.ink:C.text, border:"1px solid "+(rType===v?C.accent:C.border), borderRadius:8, padding:"10px 6px", fontWeight:700, fontSize:13, cursor:"pointer" }}>{l}</button>
                  ))}
                </div>
              </div>
              <div style={{ display:"flex", gap:10, marginBottom:16 }}>
                <div style={{ flex:1 }}>
                  <div style={lbl}>Building</div>
                  <select value={rBldg} onChange={e=>setRBldg(e.target.value)} style={inp}><option>All</option>{BUILDINGS.map(b=><option key={b}>{b}</option>)}</select>
                </div>
                {rType==="log" && <div style={{ flex:1 }}>
                  <div style={lbl}>Status</div>
                  <select value={rStatus} onChange={e=>setRStatus(e.target.value)} style={inp}>{["All","installed","removed","pmi-received","pmi-returned"].map(s=><option key={s}>{s}</option>)}</select>
                </div>}
              </div>
              <button onClick={doPrint} style={btnS(C.accent,C.ink)}><Printer size={17}/> Print Report</button>
            </div>
          </div>
          <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
            <SectionHead icon={FileText} color="#1F5FB0" bg="#E8F0FB" title="Preview" right={<span style={{ ...mf, color:C.muted, fontSize:12 }}>{preview.length} record(s)</span>}/>
            {preview.length===0 ? <div style={{ padding:32, textAlign:"center", color:C.muted }}><Boxes size={30} color={C.border} style={{ display:"block", margin:"0 auto 8px" }}/>No records match</div>
              : preview.map((e,i)=>(
                <div key={i} style={{ padding:"10px 16px", borderBottom:i<preview.length-1?"1px solid "+C.border:"none", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div>
                    <div style={{ ...mf, fontWeight:600, fontSize:13 }}>{e.srlId}</div>
                    <div style={{ ...mf, color:C.muted, fontSize:11, marginTop:2 }}>{e.building}{e.level?" · "+e.level:""}</div>
                  </div>
                  {e.status && <Badge status={e.status}/>}
                </div>
              ))}
          </div>
        </div>
      );
    }

    function App() {
      const [screen,setScreen]=useState("login"); const [user,setUser]=useState(null); const [pending,setPending]=useState(null);
      const [inv,setInv]=useState([]); const [shack,setShack]=useState({"GCS-A":[],"GCS-B":[]});
      const [toast,setToast]=useState(null);
      const [syncing,setSyncing]=useState(false);
      const [fSrl,setFSrl]=useState(""); const [fBldg,setFBldg]=useState("GCS-A"); const [fLevel,setFLevel]=useState("Ground Level");
      const [fHivis,setFHivis]=useState(""); const [fCol,setFCol]=useState(""); const [fNote,setFNote]=useState(""); const [fFiles,setFFiles]=useState([]);
      const [pmiId,setPmiId]=useState(""); const [pmiQty,setPmiQty]=useState("1");
      const [q,setQ]=useState(""); const [results,setResults]=useState([]);

      useEffect(()=>{ if(!toast)return; const t=setTimeout(()=>setToast(null),2500); return()=>clearTimeout(t); },[toast]);
      const notify=(msg,k)=>setToast({msg,k:k||"ok"});

      const loadData = async () => {
        setSyncing(true);
        try {
          const d = await dbGet("main");
          if (d) { setInv(d.inv||[]); setShack(d.shack||{"GCS-A":[],"GCS-B":[]}); }
        } catch(e) {}
        setSyncing(false);
      };
      const persist = async (nextInv, nextShack) => {
        try { await dbSet("main", { inv:nextInv, shack:nextShack }); }
        catch(e) { notify("Sync failed — check connection","warn"); }
      };

      useEffect(()=>{ loadData(); if(!CONFIGURED) setTimeout(()=>notify("Supabase not set up — data won't be shared","warn"),800); },[]);
      useEffect(()=>{ if(screen!=="login") loadData(); },[screen]);

      const log=extra=>({id:Date.now(),ts:new Date().toLocaleString(),by:user?user.name:"",...extra});

      const installSRL=async()=>{
        if(!fSrl||!fHivis||!fCol)return notify("Fill all required fields","warn");
        const entry = log({srlId:fSrl,building:fBldg,level:fLevel,hivis:fHivis,column:fCol,comment:fNote,fileCount:fFiles.length,status:"installed"});
        const nextInv=[entry,...inv];
        const nextShack={...shack,[fBldg]:shack[fBldg].filter(x=>x.srlId!==fSrl)};
        setInv(nextInv); setShack(nextShack);
        if(fFiles.length){ try{ await dbSet("f-"+entry.id, fFiles); }catch(e){} }
        persist(nextInv,nextShack);
        setFSrl("");setFHivis("");setFCol("");setFNote("");setFFiles([]);
        notify("SRL "+entry.srlId+" installed");
      };
      const removeSRL=e=>{
        const entry = log({srlId:e.srlId,building:e.building,level:"Print Shack",hivis:"—",column:"—",comment:"Returned to shack",fileCount:0,status:"removed"});
        const nextInv=[entry,...inv];
        const nextShack={...shack,[e.building]:[...shack[e.building],{srlId:e.srlId,ts:new Date().toLocaleString()}]};
        setInv(nextInv); setShack(nextShack); persist(nextInv,nextShack);
        notify("SRL "+e.srlId+" removed");
      };
      const receivePMI=()=>{
        if(!pmiId||!pmiQty)return notify("Fill all required fields","warn");
        const b=(user&&user.building)||fBldg;
        const newUnits=[]; for(let i=0;i<parseInt(pmiQty);i++)newUnits.push({srlId:pmiId+"-"+(i+1),ts:new Date().toLocaleString()});
        const entry = log({srlId:pmiId+" ×"+pmiQty,building:b,level:"PMI Trailer",hivis:"IN",column:"—",comment:"From PMI trailer",fileCount:0,status:"pmi-received"});
        const nextInv=[entry,...inv];
        const nextShack={...shack,[b]:[...shack[b],...newUnits]};
        setInv(nextInv); setShack(nextShack); persist(nextInv,nextShack);
        setPmiId("");setPmiQty("1");
        notify(pmiQty+" unit(s) received");
      };
      const returnPMI=b=>{
        const n=shack[b].length; if(!n)return notify("Shack empty","warn");
        const entry = log({srlId:n+" units",building:b,level:"PMI Trailer",hivis:"OUT",column:"—",comment:"Returned to PMI",fileCount:0,status:"pmi-returned"});
        const nextInv=[entry,...inv];
        const nextShack={...shack,[b]:[]};
        setInv(nextInv); setShack(nextShack); persist(nextInv,nextShack);
        notify(n+" returned");
      };
      const getInstalled=()=>{ const a=new Set(),o=[]; inv.forEach(e=>{ if(e.status==="installed"&&!a.has(e.srlId)){a.add(e.srlId);o.push(e);}else if(e.status==="removed")a.delete(e.srlId);}); return o; };
      const isQC=user&&(user.role==="QC"||user.role==="Inventory Manager");

      if(screen==="login"){
        if(pending) return <PinPad label={pending.role+(pending.building?" · "+pending.building:" · All Buildings")} code={pending.code} onOk={()=>{setUser(pending);if(pending.building)setFBldg(pending.building);setPending(null);setScreen("dashboard");}} onBack={()=>setPending(null)}/>;
        return (
          <div style={{ background:C.ink, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
            <div style={{ width:"100%", maxWidth:360 }}>
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:32 }}>
                <div style={{ background:C.accent, borderRadius:12, width:52, height:52, display:"grid", placeItems:"center" }}><HardHat size={28} color={C.ink}/></div>
                <div><div style={{ ...df, color:"#fff", fontSize:36, fontWeight:700, lineHeight:1 }}>GCS BUILDINGS</div><div style={{ ...mf, color:"#7E8794", fontSize:11, marginTop:4, letterSpacing:2 }}>SRL LOG · FALL PROTECTION</div></div>
              </div>
              <div style={{ background:C.inkSoft, borderRadius:12, padding:16, border:"1px solid "+C.line }}>
                <div style={{ ...sf, color:"#9AA3AF", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:2, marginBottom:12 }}>SIGN IN</div>
                {USERS.map((u,i)=>(
                  <button key={i} onClick={()=>setPending(u)} style={{ ...sf, background:"#262B33", border:"1px solid "+C.line, borderRadius:10, padding:"14px 16px", width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer", marginBottom:i<USERS.length-1?8:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:34, height:34, borderRadius:99, background:C.accent, display:"grid", placeItems:"center", flexShrink:0 }}><User size={16} color={C.ink}/></div>
                      <div style={{ textAlign:"left" }}>
                        <div style={{ color:"#E6E8EC", fontWeight:600, fontSize:14 }}>{u.name}</div>
                        <div style={{ ...mf, color:"#7E8794", fontSize:11, marginTop:2, textTransform:"uppercase", letterSpacing:1 }}>{u.role}{u.building?" · "+u.building:" · ALL BUILDINGS"}</div>
                      </div>
                    </div>
                    <ChevronRight size={18} color="#7E8794"/>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      const tabs = isQC
        ? [{id:"dashboard",l:"Home",ic:LayoutDashboard},{id:"install",l:"Install",ic:PackagePlus},{id:"installed",l:"Installed",ic:ListChecks},{id:"reports",l:"Reports",ic:Printer},{id:"search",l:"History",ic:Search}]
        : [{id:"dashboard",l:"Home",ic:LayoutDashboard},{id:"pmi",l:"PMI",ic:Truck},{id:"shack",l:"Shack",ic:Warehouse},{id:"reports",l:"Reports",ic:Printer},{id:"search",l:"History",ic:Search}];

      return (
        <div style={{ background:C.paper, minHeight:"100vh", ...sf }}>
          <div style={{ background:C.card, borderBottom:"1px solid "+C.border, padding:"12px 16px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ background:C.accent, borderRadius:8, width:34, height:34, display:"grid", placeItems:"center" }}><HardHat size={18} color={C.ink}/></div>
              <div>
                <div style={{ ...df, color:C.text, fontSize:20, fontWeight:700, lineHeight:1 }}>GCS BUILDINGS</div>
                <div style={{ ...mf, color:C.muted, fontSize:10, marginTop:2 }}>{user?user.name:""}{user&&user.building?" · "+user.building:""}</div>
              </div>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <button onClick={loadData} style={{ background:C.paper, border:"1px solid "+C.border, borderRadius:8, width:36, height:36, display:"grid", placeItems:"center", cursor:"pointer" }}>
                <RefreshCw size={15} color={syncing?C.accent:C.muted} style={syncing?{animation:"spin 1s linear infinite"}:{}}/>
              </button>
              {user&&user.building && <div style={{ background:C.accentSoft, borderRadius:8, padding:"4px 10px", display:"flex", alignItems:"center", gap:4 }}><MapPin size={13} color={C.accent}/><span style={{ ...sf, color:"#9A5E04", fontSize:12, fontWeight:600 }}>{user.building}</span></div>}
              <button onClick={()=>{setUser(null);setPending(null);setScreen("login");}} style={{ background:C.paper, border:"1px solid "+C.border, borderRadius:8, width:36, height:36, display:"grid", placeItems:"center", cursor:"pointer" }}><LogOut size={16} color={C.muted}/></button>
            </div>
          </div>

          <div style={{ padding:16, paddingBottom:84 }}>
            {screen==="dashboard" && (
              <div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
                  {[
                    {l:"Installed",v:getInstalled().length,ic:ListChecks,bg:"#E7F4EC",fg:"#1B7A43"},
                    {l:"GCS-A Shack",v:shack["GCS-A"].length,ic:Warehouse,bg:"#E8F0FB",fg:"#1F5FB0"},
                    {l:"GCS-B Shack",v:shack["GCS-B"].length,ic:Warehouse,bg:"#FBEFD7",fg:"#9A5E04"},
                    {l:"Log Entries",v:inv.length,ic:Activity,bg:"#F1ECF9",fg:"#6A45A8"},
                  ].map((mm,i)=>{
                    const Ic = mm.ic;
                    return (
                      <div key={i} style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, padding:14 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                          <div>
                            <div style={{ ...sf, color:C.muted, fontSize:11, fontWeight:600, textTransform:"uppercase" }}>{mm.l}</div>
                            <div style={{ ...df, color:C.text, fontSize:36, fontWeight:700, marginTop:4, lineHeight:1 }}>{mm.v}</div>
                          </div>
                          <div style={{ width:34, height:34, borderRadius:8, background:mm.bg, display:"grid", placeItems:"center" }}><Ic size={17} color={mm.fg}/></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
                  <SectionHead icon={Activity} color="#6A45A8" bg="#F1ECF9" title="Recent Activity"
                    right={<button onClick={()=>setScreen("search")} style={{ color:C.accent, background:"none", border:"none", fontWeight:600, cursor:"pointer", fontSize:13, ...sf }}>View all</button>}/>
                  {inv.length===0 ? <div style={{ padding:32, textAlign:"center", color:C.muted }}><Boxes size={30} color={C.border} style={{ display:"block", margin:"0 auto 8px" }}/>No activity yet</div>
                    : inv.slice(0,6).map((e,i)=>(
                      <div key={i} style={{ padding:"10px 16px", borderBottom:i<5&&i<inv.length-1?"1px solid "+C.border:"none", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                        <div><div style={{ ...mf, fontWeight:600, fontSize:13 }}>{e.srlId}</div><div style={{ ...mf, color:C.muted, fontSize:11 }}>{e.building} · {e.level} · {e.by}</div></div>
                        <Badge status={e.status}/>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {screen==="install" && (
              <div style={{ maxWidth:500 }}>
                <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
                  <SectionHead icon={PackagePlus} color="#1B7A43" bg="#E7F4EC" title="Install SRL"/>
                  <div style={{ padding:16 }}>
                    {[["SRL ID",fSrl,e=>setFSrl(e.target.value.toUpperCase()),"e.g. 123456"],["Hivis (scaffold #)",fHivis,e=>setFHivis(e.target.value.toUpperCase()),"e.g. 654321"],["Column",fCol,e=>setFCol(e.target.value.toUpperCase()),"e.g. A1"]].map(([l,v,fn,ph],i)=>(
                      <div key={i} style={{ marginBottom:14 }}>
                        <div style={lbl}>{l} *</div>
                        <input value={v} onChange={fn} placeholder={ph} style={{ ...inp, ...mf }}/>
                      </div>
                    ))}
                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }}>
                      <div><div style={lbl}>Building</div><select value={fBldg} onChange={e=>setFBldg(e.target.value)} style={inp}>{BUILDINGS.map(b=><option key={b}>{b}</option>)}</select></div>
                      <div><div style={lbl}>Level</div><select value={fLevel} onChange={e=>setFLevel(e.target.value)} style={inp}>{LEVELS.map(l=><option key={l}>{l}</option>)}</select></div>
                    </div>
                    <div style={{ marginBottom:14 }}><div style={lbl}>Comments</div><textarea value={fNote} onChange={e=>setFNote(e.target.value)} placeholder="Optional notes..." rows={3} style={{ ...inp, resize:"none" }}/></div>
                    <div style={{ marginBottom:16 }}><div style={lbl}>Photos & Files (up to 5)</div><FileUploader files={fFiles} setFiles={setFFiles}/></div>
                    <button onClick={installSRL} style={btnS(C.accent,C.ink)}><PackagePlus size={17}/> Confirm Installation</button>
                  </div>
                </div>
              </div>
            )}

            {screen==="installed" && (
              <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
                <SectionHead icon={ListChecks} color="#1B7A43" bg="#E7F4EC" title="Installed Units"
                  right={<span style={{ ...df, color:C.accent, fontSize:22, fontWeight:700 }}>{getInstalled().length}</span>}/>
                {getInstalled().length===0 ? <div style={{ padding:32, textAlign:"center", color:C.muted }}><Boxes size={30} color={C.border} style={{ display:"block", margin:"0 auto 8px" }}/>No SRLs installed</div>
                  : getInstalled().map((e,i,arr)=>(
                    <div key={i} style={{ padding:"12px 16px", borderBottom:i<arr.length-1?"1px solid "+C.border:"none" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                        <div>
                          <div style={{ ...mf, fontWeight:600 }}>{e.srlId}</div>
                          <div style={{ ...mf, color:C.muted, fontSize:11, marginTop:2 }}>{e.building} · {e.level} · H{e.hivis}/{e.column}</div>
                          {e.comment && <div style={{ ...sf, color:C.muted, fontSize:12, marginTop:2 }}>{e.comment}</div>}
                          <EntryFiles entryId={e.id} count={e.fileCount}/>
                        </div>
                        <button onClick={()=>removeSRL(e)} style={{ ...sf, background:"#FBEAEA", color:"#B23030", border:"none", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer" }}>Remove</button>
                      </div>
                    </div>
                  ))}
              </div>
            )}

            {screen==="reports" && <Reports inv={inv} shack={shack}/>}

            {screen==="pmi" && (
              <div>
                <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, marginBottom:12, overflow:"hidden" }}>
                  <SectionHead icon={Truck} color="#1F5FB0" bg="#E8F0FB" title="PMI Trailer · Receive"/>
                  <div style={{ padding:16 }}>
                    <div style={{ marginBottom:12 }}><div style={lbl}>SRL Batch ID *</div><input value={pmiId} onChange={e=>setPmiId(e.target.value.toUpperCase())} placeholder="e.g. SRL-001" style={{ ...inp, ...mf }}/></div>
                    <div style={{ marginBottom:16 }}><div style={lbl}>Quantity *</div><input type="number" min="1" value={pmiQty} onChange={e=>setPmiQty(e.target.value)} style={inp}/></div>
                    <button onClick={receivePMI} style={btnS(C.accent,C.ink)}><ArrowDownToLine size={17}/> Confirm Receipt</button>
                  </div>
                </div>
                <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
                  <SectionHead icon={Truck} color="#B23030" bg="#FBEAEA" title="PMI Trailer · Return Excess"/>
                  <div style={{ padding:16 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", background:C.paper, borderRadius:8, padding:"10px 14px", marginBottom:12 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}><Warehouse size={16} color={C.muted}/><span style={{ color:C.muted, fontSize:13 }}>Units in {user&&user.building} shack</span></div>
                      <span style={{ ...df, fontSize:28, fontWeight:700 }}>{(user&&shack[user.building]?shack[user.building].length:0)}</span>
                    </div>
                    <button onClick={()=>returnPMI(user.building)} style={{ ...btnS("#FBEAEA","#B23030"), border:"1px solid #F2C9C9" }}><ArrowUpFromLine size={16}/> Return All to PMI</button>
                  </div>
                </div>
              </div>
            )}

            {screen==="shack" && (
              <div style={{ display:"grid", gap:12 }}>
                {(user&&user.building?[user.building]:BUILDINGS).map(b=>(
                  <div key={b} style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
                    <SectionHead icon={Warehouse} color="#9A5E04" bg={C.accentSoft} title={b+" Print Shack"}
                      right={<span style={{ ...df, color:C.accent, fontSize:24, fontWeight:700 }}>{shack[b]?shack[b].length:0}</span>}/>
                    <div style={{ maxHeight:240, overflowY:"auto" }}>
                      {(!shack[b]||shack[b].length===0) ? <div style={{ padding:24, textAlign:"center", color:C.muted }}><Boxes size={26} color={C.border} style={{ display:"block", margin:"0 auto 6px" }}/>Empty</div>
                        : shack[b].map((x,i)=>(
                          <div key={i} style={{ padding:"8px 16px", borderBottom:"1px solid "+C.border, display:"flex", justifyContent:"space-between" }}>
                            <span style={{ ...mf, fontSize:13 }}>{x.srlId}</span>
                            <span style={{ ...mf, color:C.muted, fontSize:11 }}>{x.ts}</span>
                          </div>
                        ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {screen==="search" && (
              <div>
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&setResults(q?inv.filter(x=>x.srlId.toUpperCase().includes(q.toUpperCase())):[])} placeholder="Search SRL ID…" style={{ ...inp, flex:1, ...mf }}/>
                  <button onClick={()=>setResults(q?inv.filter(x=>x.srlId.toUpperCase().includes(q.toUpperCase())):[])} style={{ ...sf, background:C.accent, color:C.ink, border:"none", borderRadius:8, padding:"0 16px", fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}><Search size={15}/> Go</button>
                </div>
                <div style={{ background:C.card, border:"1px solid "+C.border, borderRadius:12, overflow:"hidden" }}>
                  <SectionHead icon={Search} color="#6A45A8" bg="#F1ECF9" title="Movement History"/>
                  {results.length===0 ? <div style={{ padding:32, textAlign:"center", color:C.muted }}><Search size={28} color={C.border} style={{ display:"block", margin:"0 auto 8px" }}/>Enter an SRL ID to search</div>
                    : results.map((e,i)=>(
                      <div key={i} style={{ padding:"12px 16px", borderBottom:i<results.length-1?"1px solid "+C.border:"none" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                          <span style={{ ...mf, fontWeight:600 }}>{e.srlId}</span><Badge status={e.status}/>
                        </div>
                        <div style={{ ...mf, color:C.muted, fontSize:11 }}>{e.building} · {e.level}</div>
                        <div style={{ ...sf, color:C.muted, fontSize:12 }}>{e.by} · {e.ts}</div>
                        <EntryFiles entryId={e.id} count={e.fileCount}/>
                      </div>
                    ))}
                </div>
              </div>
            )}
          </div>

          <div style={{ position:"fixed", bottom:0, left:0, right:0, background:C.ink, borderTop:"1px solid "+C.line, display:"flex", zIndex:50 }}>
            {tabs.map(t=>{
              const Ic = t.ic;
              return (
                <button key={t.id} onClick={()=>setScreen(t.id)}
                  style={{ flex:1, ...sf, color:screen===t.id?C.accent:"#8A929C", background:"none", border:"none", padding:"9px 0 10px", fontSize:10, fontWeight:600, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
                  <Ic size={20}/>
                  {t.l}
                </button>
              );
            })}
          </div>

          {toast && (
            <div style={{ position:"fixed", bottom:76, right:16, background:C.card, border:"1px solid "+C.border, borderRadius:12, padding:"12px 16px", display:"flex", alignItems:"center", gap:10, minWidth:220, boxShadow:"0 4px 20px rgba(0,0,0,0.1)", zIndex:99 }}>
              {toast.k==="warn"?<X size={16} color="#D14343"/>:<CheckCircle2 size={16} color="#22A35A"/>}
              <span style={{ ...sf, color:C.text, fontSize:13 }}>{toast.msg}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
